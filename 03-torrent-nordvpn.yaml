version: '3.7'
services:

####### Get PrivateKey #############################################################################################
#                                                                                                                 #
# docker run --rm --cap-add=NET_ADMIN -e USER=XXX -e PASS=YYY bubuntux/nordvpn:get_private_key                    #
#                                                                                                                 #
####################################################################################################################

  nordvpn:
    image: bubuntux/nordlynx:2024-12-31
    container_name: nordvpn
    cap_add:
      - NET_ADMIN #required
    environment:
      - PRIVATE_KEY=${VPN_PRIVATE_KEY} #required
      # curl --silent "https://api.nordvpn.com/v1/servers/countries" | jq --raw-output '.[] | [.id, .name] | @tsv'
      - QUERY=filters\[country_id\]=2&filters\[servers_groups\]\[identifier\]=legacy_p2p # Albania
      # Allow all IPs
      - ALLOWED_IPS=0.0.0.0/0
      # A semicolon-separated list of ports to open in the container's firewall.
      - PORTS=4711;4712;4662;4663;4664;4665;4672;6584;9091;6881
    ports:
      - "4711:4711" #Amule GUI port
      - "9091:9091" #QBittorrent GUI port
      - "6881:6881" #QBittorrent connection port TCP
      - "6881:6881/udp" #QBittorrent connection port UDP
      - "4712:4712"
      - "4662:4662"
      - "4663:4663"
      - "4664:4664"
      - "4665:4665/udp"
      - "4672:4672/udp"
      - "6584:6584"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1 #Disable IPv6
    restart: unless-stopped

  torrent:
    image: linuxserver/qbittorrent
    container_name: torrent
    user: root
    network_mode: service:nordvpn
    depends_on:
      - nordvpn
    environment:
      - TZ=${TZ}
      - UMASK=${UMASK}
      - WEBUI_PORT=9091
    volumes:
      - ./${TORRENT_FOLDER}/config:/config
      - ./${TORRENT_FOLDER}/downloads:/downloads
      - ./${TORRENT_FOLDER}/incomplete:/incomplete
      - ./${TORRENT_FOLDER}/torrents:/torrents
      - ./torrent-init.sh:/etc/cont-init.d/99-vuetorrent # Use AlternativeUI in /config/qBittorrent/vuetorrent
    restart: unless-stopped

  emule:
    image: ngosang/amule
    container_name: emule
    user: root
    network_mode: service:nordvpn
    depends_on:
      - nordvpn
    environment:
      - TZ=${TZ}
      - GUI_PWD=${AMULE_PASSWORD}
      - WEBUI_PWD=${AMULE_PASSWORD}
      - MOD_AUTO_RESTART_ENABLED=true
      - MOD_AUTO_RESTART_CRON=0 6 * * *
      - MOD_AUTO_SHARE_ENABLED=false
      - MOD_AUTO_SHARE_DIRECTORIES=/incoming;/my_movies
      - MOD_FIX_KAD_GRAPH_ENABLED=true
    volumes:
      - ./${AMULE_FOLDER}/conf/:/home/amule/.aMule
      - ./${AMULE_FOLDER}/incoming/:/incoming
      - ./${AMULE_FOLDER}/temp/:/temp
    restart: unless-stopped
